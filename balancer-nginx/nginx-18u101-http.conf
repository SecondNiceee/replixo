server {
	listen      80;
	listen [::]:80;
	server_name  replixo.ru www.replixo.ru;
	access_log "/wwwlogs_ext/18u101/replixo80_$year-$month-$day.log" common;
	error_log  "/wwwlogs_ext/18u101/error_replixo80.log" notice;

	return 301 https://replixo.ru$request_uri;
}

server {
	listen      443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name         www.replixo.ru;
#	ssl_certificate     cert/.replixo.ru/fullchain1.pem;
#	ssl_certificate_key cert/.replixo.ru/privkey1.pem;
	access_log "/wwwlogs_ext/18u101/wwwreplixo_$year-$month-$day.log" common;
	error_log  "/wwwlogs_ext/18u101/error_wwwreplixo.log" notice;

	return 301 https://replixo.ru$request_uri;
}

server {
	listen      443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name         replixo.ru;
#	ssl_certificate     cert/.replixo.ru/fullchain1.pem;
#	ssl_certificate_key cert/.replixo.ru/privkey1.pem;
	access_log "/wwwlogs_ext/18u101/replixo_$year-$month-$day.log" common;
	error_log  "/wwwlogs_ext/18u101/error_replixo.log" notice;

	proxy_http_version 1.1;
	proxy_set_header   Host              $host;
	proxy_set_header   X-Real-IP         $remote_addr;
	proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
	proxy_set_header   X-Forwarded-Proto https;

	location / {
		client_max_body_size 30m;
		proxy_pass http://${18u101}:3000$request_uri;
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_buffering         off;
		proxy_request_buffering off;
		proxy_read_timeout      300s;
		proxy_send_timeout      300s;
	}

	location /socket.io/ {
		proxy_pass http://${18u101}:3001$request_uri;
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_buffering    off;
		proxy_read_timeout 86400s;
		proxy_send_timeout 86400s;
	}

	location /rooms/ {
		client_max_body_size 30m;
		proxy_pass http://${18u101}:3001$request_uri;
		proxy_request_buffering off;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}

	location /uploads/ {
		proxy_pass http://${18u101}:3001$request_uri;
	}

	location /download/ {
		proxy_pass http://${18u101}:3001$request_uri;
		proxy_buffering          off;
		proxy_request_buffering  off;
		proxy_max_temp_file_size 0;
		proxy_read_timeout       86400s;
		proxy_send_timeout       86400s;
	}
}
