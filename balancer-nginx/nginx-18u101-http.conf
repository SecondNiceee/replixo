# Replixo за балансером office.smartcardio.ru.
# HTTPS завершается здесь, на балансере. Дальше трафик идёт по внутренней сети
# напрямую в приложения на сервере ${18u101}:
#   :3000 — Next.js (сайт)
#   :3001 — Mediasoup / Socket.io / загрузки / установщик
# Свой nginx на сервере при такой схеме не нужен.

# ── HTTP → HTTPS, сразу на адрес без www ─────────────────────────────
server {
	listen      80;
	listen [::]:80;
	server_name         replixo.ru www.replixo.ru;
	access_log "/wwwlogs_ext/replixo80/$year-$month-$day.log" common;
	error_log  "/wwwlogs_ext/error_replixo80.log" notice;

	return 301 https://replixo.ru$request_uri;
}

# ── www → без www (один адрес сайта для Яндекса, без дублей) ─────────
server {
	listen      443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name         www.replixo.ru;
#	ssl_certificate     cert/.replixo.ru/fullchain1.pem;
#	ssl_certificate_key cert/.replixo.ru/privkey1.pem;
	access_log "/wwwlogs_ext/replixo/$year-$month-$day.log" common;
	error_log  "/wwwlogs_ext/error_replixo.log" notice;

	return 301 https://replixo.ru$request_uri;
}

# ── Основной сайт ────────────────────────────────────────────────────
server {
	listen      443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name         replixo.ru;
#	ssl_certificate     cert/.replixo.ru/fullchain1.pem;
#	ssl_certificate_key cert/.replixo.ru/privkey1.pem;
	access_log "/wwwlogs_ext/replixo/$year-$month-$day.log" common;
	error_log  "/wwwlogs_ext/error_replixo.log" notice;

	# Общие заголовки для всех location ниже. Без X-Forwarded-Proto приложение
	# думает, что работает по http, и ломаются secure-куки авторизации.
	proxy_http_version 1.1;
	proxy_set_header   Host              $host;
	proxy_set_header   X-Real-IP         $remote_addr;
	proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
	proxy_set_header   X-Forwarded-Proto https;

	# ── Next.js ──────────────────────────────────────────────────────
	# Next.js стримит HTML и RSC, поэтому буферизация выключена.
	location / {
		client_max_body_size 30m;
		proxy_pass http://${18u101}:3000$request_uri;
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_buffering         off;
		proxy_request_buffering off;
		proxy_read_timeout      300s;
		proxy_send_timeout      300s;
	}

	# ── Socket.io (сигналинг звонков и чат) ─────────────────────────
	# Сначала идёт HTTP-polling без Upgrade, потом переход на WebSocket,
	# поэтому Connection берём из map, а не хардкодом.
	location /socket.io/ {
		proxy_pass http://${18u101}:3001$request_uri;
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_buffering    off;
		proxy_read_timeout 86400s;
		proxy_send_timeout 86400s;
	}

	# ── Загрузка файлов в звонке ────────────────────────────────────
	location /rooms/ {
		client_max_body_size 30m;
		proxy_pass http://${18u101}:3001$request_uri;
		proxy_request_buffering off;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}

	# ── Выдача загруженных вложений ─────────────────────────────────
	location /uploads/ {
		proxy_pass http://${18u101}:3001$request_uri;
	}

	# ── Установщик Windows ──────────────────────────────────────────
	# Большой файл: отдаём потоком, без temp-файлов на балансере.
	location /download/ {
		proxy_pass http://${18u101}:3001$request_uri;
		proxy_buffering          off;
		proxy_request_buffering  off;
		proxy_max_temp_file_size 0;
		proxy_read_timeout       86400s;
		proxy_send_timeout       86400s;
	}
}
