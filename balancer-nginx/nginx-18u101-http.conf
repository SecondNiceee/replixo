server {
	listen      80;
	listen [::]:80;
	http2 on;
	server_name         test.ru;
	access_log "/wwwlogs_ext/test80/$year-$month-$day.log" common;
	error_log  "/wwwlogs_ext/error_test80.log" notice;

	location / {
        	proxy_pass http://${18u101}:3000$request_uri;
	    	proxy_buffering off;
	    	proxy_request_buffering off;
	        proxy_http_version 1.1;
	        proxy_set_header Upgrade $http_upgrade;
	        proxy_set_header Connection $connection_upgrade;
	}
}	

server {
	listen      443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name         test.ru;
#	ssl_certificate     cert/.test.ru/fullchain1.pem;
#	ssl_certificate_key cert/.test.ru/privkey1.pem;
	access_log "/wwwlogs_ext/test/$year-$month-$day.log" common;
	error_log  "/wwwlogs_ext/error_test.log" notice;

	location / {
        	proxy_pass http://${18u101}:3000$request_uri;
	    	proxy_buffering off;
	    	proxy_request_buffering off;
	        proxy_http_version 1.1;
	        proxy_set_header Upgrade $http_upgrade;
	        proxy_set_header Connection $connection_upgrade;
	}
}	
