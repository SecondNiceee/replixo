server {
	listen      18101;
	listen [::]:18101;
	access_log "/wwwlogs_ext/18u101/ssh_$year-$month-$day.log" common;
	error_log  "/wwwlogs_ext/18u101/error_ssh.log" notice;
	proxy_pass ${18u101}:22;
}

server {
	listen      40000 udp;
	listen [::]:40000 udp;
	access_log "/wwwlogs_ext/18u101/rtc_udp_$year-$month-$day.log" common;
	error_log  "/wwwlogs_ext/18u101/error_rtc_udp.log" notice;
	proxy_pass    ${18u101}:40000;
	proxy_timeout 10m;
}

server {
	listen      40000;
	listen [::]:40000;
	access_log "/wwwlogs_ext/18u101/rtc_tcp_$year-$month-$day.log" common;
	error_log  "/wwwlogs_ext/18u101/error_rtc_tcp.log" notice;
	proxy_pass    ${18u101}:40000;
	proxy_timeout 1h;
}
