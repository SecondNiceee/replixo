# ── SSH до сервера (как было) ────────────────────────────────────────
server {
	listen      18101;
	listen [::]:18101;
	access_log "/wwwlogs_ext/ssh18101/$year-$month-$day.log" common;
	error_log  "/wwwlogs_ext/error_ssh18101.log" notice;
	proxy_pass ${18u101}:22;
}

# ── Медиа звонков (WebRTC, Mediasoup) ────────────────────────────────
# Голос и видео идут не через сайт, а напрямую по этим портам.
# На сервере в .env Mediasoup должно быть:
#   RTC_MIN_PORT=40000
#   RTC_MAX_PORT=40199
#   ANNOUNCED_IP=<публичный IP балансера office.smartcardio.ru>
# Порт на балансере совпадает с портом на сервере ($server_port).
# Диапазон в listen поддерживается в nginx 1.27.3 и новее.
server {
	listen      40000-40199 udp;
	listen [::]:40000-40199 udp;
	access_log "/wwwlogs_ext/rtc_udp/$year-$month-$day.log" common;
	error_log  "/wwwlogs_ext/error_rtc_udp.log" notice;
	proxy_pass    ${18u101}:$server_port;
	proxy_timeout 10m;
}

# Запасной канал по TCP, если у пользователя режут UDP (часть офисов и
# мобильных сетей). Mediasoup слушает те же порты и по TCP.
server {
	listen      40000-40199;
	listen [::]:40000-40199;
	access_log "/wwwlogs_ext/rtc_tcp/$year-$month-$day.log" common;
	error_log  "/wwwlogs_ext/error_rtc_tcp.log" notice;
	proxy_pass    ${18u101}:$server_port;
	proxy_timeout 1h;
}
