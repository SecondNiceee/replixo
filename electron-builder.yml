appId: ru.replixo.desktop
productName: Replixo
copyright: Copyright © 2026 Replixo

directories:
  output: release
  buildResources: electron/icons

# В .exe попадает только оболочка Electron — само приложение
# загружается по URL (https://replixo.ru), поэтому сборка лёгкая.
files:
  - electron/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/icons/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Replixo
  # Фиксированное имя установщика без пробелов и версии, чтобы ссылка
  # /download/windows не ломалась при выходе новых версий.
  artifactName: Replixo-Setup.exe
