appId: ru.replixo.desktop
productName: Replixo
copyright: Copyright © 2026 Replixo

directories:
  output: release
  buildResources: electron/icons

# В .exe попадает только оболочка Electron — само приложение
# загружается по URL (https://replixo.ru), поэтому сборка лёгкая.
files:
  - electron/**/*
  - package.json
  # Исходники нативного helper'а не нужны в сборке — только бинарь (extraResources).
  - "!electron/native/**/*"

# uiohook-napi содержит нативный .node-модуль и должен загружаться с диска,
# а не из app.asar.
asarUnpack:
  - node_modules/uiohook-napi/prebuilds/**/*.node

# Нативный helper процесс-лупбэка (Variant A, about/echo-fix/plan.md).
# Собранный бинарь кладётся в resources/native/ и доступен как
# process.resourcesPath/native/process-loopback-capture.exe.
extraResources:
  - from: electron/native/process-loopback/bin/process-loopback-capture.exe
    to: native/process-loopback-capture.exe

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/icons/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Replixo
  # Имя с версией: latest.yml ссылается на конкретный файл, и разные релизы
  # не перетирают друг друга в кэше. /download/windows сам находит актуальный
  # установщик по latest.yml.
  artifactName: Replixo-Setup-${version}.exe
  differentialPackage: true

# Автообновление: electron-updater читает https://replixo.ru/updates/latest.yml.
# После `pnpm dist` залейте из release/ на сервер в UPDATES_DIR три файла:
# latest.yml, Replixo-Setup-<версия>.exe и Replixo-Setup-<версия>.exe.blockmap.
publish:
  provider: generic
  url: https://replixo.ru/updates/
