<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <style>
    @media (prefers-color-scheme: dark) {
      .tile-top { stop-color: #2b3034; }
      .tile-bottom { stop-color: #101416; }
      .tile-border { stroke: #1c2226; }
      .camera-top { stop-color: #14ffe1; }
      .camera-bottom { stop-color: #00e7b4; }
    }
  </style>
  <defs>
